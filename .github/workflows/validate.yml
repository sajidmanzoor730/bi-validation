name: BI validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run project quality gate
        run: python validate_project.py
      - name: Calculate Python KPI baseline
        run: python reconcile_kpis.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
